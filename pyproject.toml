[project]
name = "pokemon-synonymy-data"
version = "0.1.0"
description = "PokéAPI ingestion and similarity graph pipeline for PokéPath"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "umap-learn>=0.5,<1"
]

[project.optional-dependencies]
embedding = [
  "huggingface-hub>=1.0,<2",
  "onnxruntime==1.20.1",
  "tokenizers>=0.21,<1"
]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
